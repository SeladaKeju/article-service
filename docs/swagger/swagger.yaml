basePath: /
definitions:
  controller.ErrorDetail:
    properties:
      code:
        example: invalid_request
        type: string
      message:
        example: request must contain author_id, title, and body
        type: string
    type: object
  controller.ListArticlesMeta:
    properties:
      next_cursor:
        example: eyJjcmVhdGVkX2F0IjoiMjAyNi0wOS0wOFQxMjowMDowMC4xMjM0NTZaIiwiaWQiOiIzZmE4NWY2NC01NzE3LTQ1NjItYjNmYy0yYzk2M2Y2NmFmYTYifQ
        type: string
    type: object
  controller.ListArticlesResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Article'
        type: array
      meta:
        $ref: '#/definitions/controller.ListArticlesMeta'
    type: object
  domain.Article:
    properties:
      author_id:
        type: string
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      title:
        type: string
    required:
    - author_id
    - body
    - title
    type: object
host: localhost:8080
info:
  contact: {}
  description: API for creating, listing, searching, and filtering articles.
  title: Article Service API
  version: "1.0"
paths:
  /articles:
    get:
      parameters:
      - description: Whole-word search across title and body
        in: query
        name: query
        type: string
      - description: Full author name, case-insensitive
        in: query
        name: author
        type: string
      - description: Results per page (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: Cursor returned by the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/controller.ListArticlesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorDetail'
      summary: List articles
      tags:
      - articles
    post:
      consumes:
      - application/json
      parameters:
      - description: Article payload
        in: body
        name: article
        required: true
        schema:
          $ref: '#/definitions/domain.Article'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Article'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/controller.ErrorDetail'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/controller.ErrorDetail'
      summary: Create an article
      tags:
      - articles
schemes:
- http
swagger: "2.0"
